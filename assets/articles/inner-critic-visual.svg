<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Внутренний критик — визуальная метафора</title><desc id="d">Мужчины и женщины, разные внутренние голоса: критический, наблюдающий, поддерживающий и творческий.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7efe8"/><stop offset="1" stop-color="#e8efe9"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c8ad"/><stop offset="1" stop-color="#f4e4d1"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6470"/><stop offset="1" stop-color="#303941"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><path d="M0 490 C180 420 330 520 500 455 S820 390 1200 470 V675 H0Z" fill="#efe5db"/><circle cx="600" cy="320" r="210" fill="none" stroke="#d8c3b6" stroke-width="2" opacity=".65"/><circle cx="600" cy="320" r="158" fill="none" stroke="#cbd8cf" stroke-width="2" opacity=".65"/><g opacity=".18" fill="#7a3345"><circle cx="895" cy="160" r="58"/><circle cx="1015" cy="225" r="24"/><circle cx="1100" cy="155" r="38"/></g><g opacity=".18" fill="#587066"><circle cx="250" cy="145" r="44"/><circle cx="145" cy="225" r="26"/><circle cx="330" cy="220" r="22"/></g><g transform="translate(125 245)"><circle cx="105" cy="80" r="60" fill="#3d4650"/><path d="M25 250c10-90 55-135 80-135s70 45 80 135" fill="url(#cool)"/><path d="M70 45c25-35 72-37 92 2-25-12-55-9-92-2" fill="#272d32"/><text x="105" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#4d4541">«Ты недостаточно хорош»</text></g><g transform="translate(330 220)"><circle cx="100" cy="92" r="58" fill="#d8a98f"/><path d="M22 260c12-88 53-130 78-130s66 42 78 130" fill="#8b6f63"/><path d="M54 62c24-45 79-50 102-5-39-15-67-13-102 5" fill="#4a3730"/><text x="100" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#6f3042">«Что со мной сейчас?»</text></g><g transform="translate(570 210)"><circle cx="90" cy="98" r="60" fill="#c99578"/><path d="M10 270c12-90 52-138 80-138s68 48 80 138" fill="#6b7b77"/><path d="M46 62c18-38 72-49 99-4-34-18-65-17-99 4" fill="#3d302a"/><text x="90" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#587066">«Я замечаю эту мысль»</text></g><g transform="translate(785 230)"><circle cx="92" cy="90" r="58" fill="#9b654f"/><path d="M14 260c12-88 53-132 78-132s66 44 78 132" fill="#a77b62"/><path d="M43 55c20-36 70-46 98-3-37-15-63-14-98 3" fill="#2f2927"/><text x="92" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7a3345">«Я могу ответить иначе»</text></g><g transform="translate(955 235)"><circle cx="82" cy="88" r="56" fill="#d8a386"/><path d="M8 252c10-83 50-126 74-126s64 43 74 126" fill="url(#warm)"/><path d="M38 55c24-38 67-43 92-4-33-15-60-12-92 4" fill="#5d4034"/><path d="M140 35c32-36 52-60 80-70M148 60c38-22 70-22 94-10M149 84c26 4 53 17 75 40" stroke="#7a3345" stroke-width="4" fill="none" opacity=".6"/><circle cx="219" cy="-38" r="9" fill="#7a3345"/><circle cx="244" cy="45" r="7" fill="#7a3345"/><circle cx="228" cy="130" r="8" fill="#7a3345"/><text x="82" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7a3345">«Я пробую и создаю»</text></g><g font-family="Arial,sans-serif"><text x="60" y="70" font-size="18" font-weight="700" letter-spacing="2" fill="#7a3345">САМОКРИТИКА · ПСИХОЛОГИЯ · ТВОРЧЕСТВО</text><text x="60" y="118" font-size="46" font-weight="700" fill="#201c1a">Внутренний критик</text><text x="60" y="153" font-size="23" fill="#554d49">Не один голос — и не один способ с ним обходиться</text></g><g transform="translate(515 485)"><rect width="390" height="108" rx="28" fill="#fff" stroke="#d6c8c0"/><text x="195" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#201c1a">Оценка результата ≠ о