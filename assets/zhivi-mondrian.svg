  <title id="title">Живи и звучи — Хайфа, четверги, 19:30</title>
  <desc id="desc">Плакат в геометрической модернистской стилистике: группа по вокальной импровизации, идея меньше репетировать жизнь в голове и чаще входить в неё.</desc>
  <rect width="1200" height="1200" fill="#f4f0e6"/>
  <g stroke="#111" stroke-width="16" fill="none">
    <path d="M55 0v1200M305 0v370M655 0v230M1005 0v1200M0 205h1200M0 520h1200M0 865h1200M0 1080h1200"/>
    <path d="M305 370h700M305 725h700M305 865v335M650 865v335M875 865v335"/>
  </g>
  <rect x="655" y="0" width="350" height="205" fill="#d92f27"/>
  <rect x="1005" y="0" width="195" height="205" fill="#f4c928"/>
  <rect x="0" y="205" width="55" height="315" fill="#2456a6"/>
  <rect x="55" y="370" width="250" height="150" fill="#d92f27"/>
  <rect x="305" y="520" width="345" height="205" fill="#f4c928"/>
  <rect x="650" y="520" width="355" height="205" fill="#2456a6"/>
  <rect x="1005" y="520" width="195" height="345" fill="#f4c928"/>
