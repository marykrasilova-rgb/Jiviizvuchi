  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="88" y="118" font-size="78" font-weight="800">ЖИВИ</text>
    <text x="330" y="118" font-size="42" font-weight="700" fill="#c89b12">И</text>
    <text x="405" y="118" font-size="78" font-weight="800" fill="#d92f27">ЗВУЧИ</text>
    <text x="86" y="172" font-size="26" font-weight="700">группа по вокальной импровизации</text>

    <text x="90" y="605" font-size="43" font-weight="800">Перестать</text>
    <text x="90" y="655" font-size="43" font-weight="800">репетировать</text>
    <text x="90" y="705" font-size="43" font-weight="800">жизнь в голове —</text>
    <text x="90" y="762" font-size="43" font-weight="800" fill="#d92f27">и чаще в неё входить</text>

    <text x="82" y="932" font-size="29" font-weight="800">Услышать импульс →</text>
    <text x="82" y="972" font-size="29" font-weight="800">попробовать</text>

    <text x="338" y="932" font-size="29" font-weight="800">Получилось</text>
    <text x="338" y="972" font-size="29" font-weight="800">неожиданно →</text>
    <text x="338" y="1012" font-size="29" font-weight="800">не остановиться</text>

    <text x="676" y="922" font-size="28" font-weight="800" fill="#fff">Кто-то ответил</text>
    <text x="676" y="960" font-size="28" font-weight="800" fill="#fff">совсем не так →</text>
    <text x="676" y="998" font-size="28" font-weight="800" fill="#fff">встроить это</text>
    <text x="676" y="1036" font-size="28" font-weight="800" fill="#fff">в происходящее</text>

    <text x="90" y="1146" font-size="38" font-weight="800">Хайфа · четверги · 19:30</text>
    <text x="898" y="1135" font-size="36" font-weight="900" fill="#fff">Пиши «ЖИВИ»</text>
  </g>

