function countDays(){const count=DAYS.ru.filter((_,d)=>GROUPS.some(g=>g.rows.some(r=>state.checks["t:"+r[0]+":"+d]))).length;$("daysCount").textContent=TR[lang].days+count+" / 7"}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";$("ruBtn").classList.toggle("active",lang==="ru");$("heBtn").classList.toggle("active",lang==="he");const pairs={pageTitle:"title",pageLead:"lead",privacyShort:"privacy",labelName:"name",labelWeek:"week",labelScale:"scale",techTitle:"tech",techSubtitle:"techHelp",piecesTitle:"pieces",piecesHelp:"piecesHelp",analysisTitle:"analysis",reflectionTitle:"reflection",improvedLabel:"improved",goalLabel:"goal",sendBtn:"send",copyBtn:"copy",printBtn:"print",nextBtn:"next",privacyLong:"privacyLong"};for(const [id,k] of Object.entries(pairs))$(id).textContent=TR[lang][k];$("student").value=student;$("week").value=week;$("scale").value=state.scale||"";qsa('textarea[data-text]').forEach(el=>el.value=state[el.dataset.text]||"");const quizText=lang==="he"?{title:"נחשו את המלחין",desc:"האזינו לקטע מוזיקלי ובחרו את המלחין. ארבע רמות קושי.",cta:"למשחק ←"}:{title:"Угадай композитора",desc:"Послушай музыкальный фрагмент и выбери композитора. Четыре уровня сложности.",cta:"Играть →"};$("quizPromoTitle").textContent=quizText.title;$("quizPromoDesc").textContent=quizText.desc;$("quizPromoLink").textContent=quizText.cta;$("quizPromoLink").href="/games?lang="+lang+"#quiz";renderTech();renderPieces();renderAnalysis();countDays();$("saveStatus").textContent=""}
function update(e){const el=e.target;if(el.dataset.check){state.checks[el.dataset.check]=el.checked;save()}else if(el.dataset.pieceCheck){let [i,c]=el.dataset.pieceCheck.split(":");state.pieces[Number(i)].done[c]=el.checked;save()}else if(el.dataset.pieceName!==undefined){state.pieces[Number(el.dataset.pieceName)].name=el.value;save()}else if(el.dataset.analysis){const [i,f]=el.dataset.analysis.split(":");state.analysis[Number(i)][f]=el.value;save()}else if(el.dataset.text){state[el.dataset.text]=el.value;save()}}
$("worksheet").addEventListener("input",e=>{if(e.target.id!=="student"&&e.target.id!=="week")update(e)});
$("worksheet").addEventListener("change",e=>{if(e.target.id==="student"){student=e.target.value.trim();load()}else if(e.target.id==="week"){week=e.target.value||todaySunday();load()}else if(e.target.type==="checkbox"){update(e)}});
function setLang(value){lang=value;localStorage.setItem("piano-practice-lang",lang);render()}
$("ruBtn").addEventListener("click",()=>setLang("ru"));$("heBtn").addEventListener("click",()=>setLang("he"));
function report(){
const t=TR[lang],lines=[t.summary,(student||t.noName),t.week+": "+week,t.scale+": "+(state.scale||"—"),""];
for(let d=0;d<7;d++){const activities=GROUPS.flatMap(g=>g.rows.filter(r=>state.checks["t:"+r[0]+":"+d]).map(r=>label(r)));if(activities.length)lines.push(DAYS[lang][d]+": "+activities.join("; "))}
if(lines[lines.length-1]==="")lines.push(t.noWork);
lines.push("",t.piecesLabel+":");for(let i=0;i<4;i++){const p=state.pieces[i];if(p.name||Object.values(p.done).some(Boolean))lines.push((p.name||t.piece+(i+1))+": "+PIECE_CRITERIA.filter(c=>p.done[c[0]]).map(label).join("; "))}
for(let i=0;i<3;i++){const a=state.analysis[i];if(Object.values(a).some(Boolean))lines.push(t.analysisLabel+" "+(i+1)+": "+A_FIELDS.filter(f=>a[f[0]]).map(f=>label(f)+": "+a[f[0]]).join("; "))}
if(state.improved)lines.push(t.improvedLabel+": "+state.improved);
if(state.goal)lines.push(t.goalLabel+": "+state.goal);
return lines.join("\n")
}
$("sendBtn").addEventListener("click",()=>{const url="https://wa.me/972542662800?text="+encodeURIComponent(report());window.open(url,"_blank","noopener,noreferrer")});
$("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(report());$("saveStatus").textContent=TR[lang].copied}catch(e){$("saveStatus").textContent=TR[lang].copyFail}});
$("printBtn").addEventListener("click",()=>window.print());
$("nextBtn").addEventListener("click",()=>{const d=new Date(week+"T12:00:00");d.setDate(d.getDate()+7);week=localDate(d);load();window.scrollTo({top:0,behavior:"smooth"})});
load();
})();
</script>
