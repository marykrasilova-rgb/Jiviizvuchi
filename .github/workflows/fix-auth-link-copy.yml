name: Finalize diary auth link copy

on:
  push:
    paths:
      - '.github/workflows/fix-auth-link-copy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Finalize user-facing link wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('diary-enhancements.js')
          s = p.read_text()
          s = s.replace("if(m.includes('expired'))return 'Код уже устарел. Нажми «Отправить новый код».';", "if(m.includes('expired'))return 'Ссылка уже устарела. Нажми «Отправить новую ссылку».';")
          s = s.replace("if(m.includes('invalid')||m.includes('token'))return 'Код не подошёл. Проверь цифры или запроси новый.';", "if(m.includes('invalid')||m.includes('token'))return 'Ссылка не подошла или уже использована. Запроси новую.';")
          s = s.replace("msg.textContent='Отправляю код…';", "msg.textContent='Отправляю ссылку…';")
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary-enhancements.js
          git rm .github/workflows/fix-auth-link-copy.yml
          git commit -m "Finalize diary magic-link wording"
          git push
