name: Curate homepage photos

on:
  push:
    paths:
      - '.github/workflows/curate-homepage-photos.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Curate homepage
        run: node scripts/curate-homepage.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/home
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Curate homepage photos and diary naming"
            git push origin HEAD:main
          fi
