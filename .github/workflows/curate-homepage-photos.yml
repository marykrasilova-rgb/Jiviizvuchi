name: Curate homepage photos

on:
  push:
    paths:
      - '.github/workflows/curate-homepage-photos.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Simplify photo usage and diary naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the two strongest music-related cards visual; turn the softer/off-topic
          # tea and sky images into clean text cards.
          s = s.replace('''   <div class="card storyCard">
    <img src="/assets/home/photo-05.webp" alt="Мария за чаем" loading="lazy">
    <div class="copy"><h3>Бережный контакт</h3><p>В работе со мной важны не только практика и результат, но и ощущение безопасности в процессе.</p></div>
   </div>
   <div class="card storyCard">
    <img src="/assets/home/photo-06.webp" alt="Мария на фоне неба" loading="lazy">
    <div class="copy"><h3>Больше воздуха</h3><p>Моя задача — помочь вам почувствовать больше пространства внутри, а не загнать в ещё одну систему оценки.</p></div>
   </div>''', '''   <div class="card">
    <h3>Бережный контакт</h3><p>В работе со мной важны не только практика и результат, но и ощущение безопасности в процессе.</p>
   </div>
   <div class="card">
    <h3>Больше воздуха</h3><p>Моя задача — помочь вам почувствовать больше пространства внутри, а не загнать в ещё одну систему оценки.</p>
   </div>''')

          # Diary: remove a generic city shot so the product itself gets the focus.
          s = s.replace('''<section class="section">
 <div class="wrap splitFeature">
  <div class="inlinePhoto"><img src="/assets/home/photo-07.webp" alt="Мария в городе" loading="lazy"></div>
  <div>
   <div class="eyebrow">Бесплатный вход</div>''', '''<section class="section">
 <div class="wrap">
  <div>
   <div class="eyebrow">Бесплатный вход</div>''')
          s = s.replace('<span class="kicker">Творческий дневник</span>', '<span class="kicker">Эмоциональный дневник</span>')
          s = s.replace('<div class="cta"><a class="btn primary" href="/app.html">Открыть дневник</a></div>', '<div class="cta"><a class="btn primary" href="/diary">Открыть дневник</a></div>')

          # Remove repeated use of photo-03 in the group section; the first use stays in About.
          s = s.replace('''   <div class="card storyCard">
    <img src="/assets/home/photo-03.webp" alt="Мария улыбается у клавиш" loading="lazy">
    <div class="copy"><h3>Группа для живого опыта</h3><p>Здесь не нужно быть певцом. В центре — практика вариантов, взаимодействие, спонтанность и способность продолжать после ошибки.</p></div>
   </div>''', '''   <div class="card">
    <h3>Группа для живого опыта</h3><p>Здесь не нужно быть певцом. В центре — практика вариантов, взаимодействие, спонтанность и способность продолжать после ошибки.</p>
   </div>''')

          # Remove repeated use of photo-04 near the final organizational CTA.
          s = s.replace('''<section class="section">
 <div class="wrap grid2">
  <div class="inlinePhoto"><img src="/assets/home/photo-04.webp" alt="Мария за фортепиано" loading="lazy"></div>
  <div class="banner">''', '''<section class="section">
 <div class="wrap">
  <div class="banner">''')

          p.write_text(s, encoding='utf-8')

          # Remove images that are no longer used.
          for name in ['photo-05.webp', 'photo-06.webp', 'photo-07.webp']:
              f = Path('assets/home') / name
              if f.exists():
                  f.unlink()

          manifest = {
              'active_photos': [
                  {'file':'photo-01.webp','alt':'Мария Красилова','placement':'hero'},
                  {'file':'photo-02.webp','alt':'Мария Красилова в культурном пространстве','placement':'about'},
                  {'file':'photo-03.webp','alt':'Мария за клавиатурой на фоне природы','placement':'about: Радость и свобода'},
                  {'file':'photo-04.webp','alt':'Мария за фортепиано в наушниках','placement':'about: Композиторское ухо'},
                  {'file':'photo-08.webp','alt':'Мария в библиотеке','placement':'musical portrait'}
              ],
              'removed_as_repetitive_or_off_topic': ['photo-05.webp','photo-06.webp','photo-07.webp'],
              'duplicate_placements_removed': ['photo-03.webp from group section','photo-04.webp from organizations section']
          }
          Path('assets/home/photo-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit curated homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/home
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Curate homepage photos and diary naming"
            git push origin HEAD:main
          fi
