name: Optimize homepage images

on:
  push:
    paths:
      - '.github/workflows/optimize-homepage-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract embedded images and update homepage
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          out = Path('assets/home')
          out.mkdir(parents=True, exist_ok=True)

          pattern = re.compile(r'<img\b[^>]*?src="data:image/(webp|png|jpeg|jpg);base64,([^"]+)"[^>]*?>', re.I | re.S)
          seen = {}
          manifest = []
          counter = 0

          def repl(match):
              nonlocal_counter = None
              global counter
              fmt = match.group(1).lower()
              if fmt == 'jpeg':
                  fmt = 'jpg'
              raw = base64.b64decode(match.group(2))
              digest = hashlib.sha256(raw).hexdigest()
              tag = match.group(0)
              alt_m = re.search(r'alt="([^"]*)"', tag, re.I)
              alt = alt_m.group(1) if alt_m else ''
              duplicate_of = None
              if digest in seen:
                  filename = seen[digest]
                  duplicate_of = filename
              else:
                  counter += 1
                  filename = f'photo-{counter:02d}.{fmt}'
                  (out / filename).write_bytes(raw)
                  seen[digest] = filename
              new_tag = re.sub(r'src="data:image/(?:webp|png|jpeg|jpg);base64,[^"]+"', f'src="/assets/home/{filename}"', tag, count=1, flags=re.I | re.S)
              manifest.append({
                  'source_order': len(manifest) + 1,
                  'file': filename,
                  'alt': alt,
                  'bytes': len(raw),
                  'sha256': digest,
                  'duplicate_of': duplicate_of,
              })
              return new_tag

          new_html, count = pattern.subn(repl, html)
          if count == 0:
              raise SystemExit('No embedded images found; nothing to migrate.')

          # Route the homepage CTA to the current pilot diary and use its current name.
          new_html = new_html.replace('href="/app.html">Попробовать творческий дневник</a>', 'href="/diary">Попробовать эмоциональный дневник</a>')
          new_html = new_html.replace('href="/app.html">Творческий дневник</a>', 'href="/diary">Эмоциональный дневник</a>')

          index.write_text(new_html, encoding='utf-8')
          (out / 'photo-manifest.json').write_text(json.dumps({
              'embedded_img_tags_found': count,
              'unique_files_written': len(seen),
              'images': manifest,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Extracted {count} image tags into {len(seen)} unique files')
          PY

      - name: Commit optimized homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/home
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract homepage photos and update diary CTA"
            git push origin HEAD:main
          fi
