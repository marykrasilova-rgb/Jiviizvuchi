name: Add gallery section
on:
  push:
    paths:
      - '.github/workflows/add-gallery-section.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add gallery to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#online">Онлайн</a><a href="#group">Группа</a><a href="#personal">Лично</a><a href="#story">Обо мне</a>', '<a href="#online">Онлайн</a><a href="#group">Группа</a><a href="#personal">Лично</a><a href="/gallery">Галерея</a><a href="#story">Обо мне</a>')
          block='''\n<section class="section">\n <div class="wrap">\n  <div class="banner">\n   <div class="eyebrow">Новый живой архив</div>\n   <h3>Галерея импровизаций</h3>\n   <p>Импровизации моих учеников и мои собственные: звук, название и визуальный образ, рожденный из самой записи.</p>\n   <p class="mini">Работы публикуются только с согласия исполнителя.</p>\n   <div class="cta"><a class="btn primary" href="/gallery">Открыть галерею</a></div>\n  </div>\n </div>\n</section>\n'''
          if 'Открыть галерею' not in s:
              s=s.replace('</main>', block+'\n</main>')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add improvisation gallery to homepage" || exit 0
          git push
