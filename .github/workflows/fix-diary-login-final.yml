name: Finalize diary login UX

on:
  push:
    paths:
      - '.github/workflows/fix-diary-login-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diary login patch
        run: python scripts/fix_diary_login.py
      - name: Commit and remove one-time patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary.html diary-enhancements.js sw.js
          git rm .github/workflows/fix-diary-login-final.yml scripts/fix_diary_login.py
          git commit -m "Fix diary login wording and resend cooldown"
          git push
