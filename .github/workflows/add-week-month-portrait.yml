name: Add week and month portrait to diary

on:
  push:
    paths:
      - '.github/workflows/add-week-month-portrait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diary history
        run: python scripts/add_week_month_portrait.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary.html diary.js diary.css
          git commit -m "Add week and month diary portraits"
          git push
