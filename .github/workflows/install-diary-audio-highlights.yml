name: Install diary audio highlights
on:
  push:
    paths:
      - '.github/workflows/install-diary-audio-highlights.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import audio highlights module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('diary.js')
          s=p.read_text()
          line="import './diary-audio-highlights.js';\n"
          if line not in s:
              s=line+s
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect diary audio montage UI"
          git push
