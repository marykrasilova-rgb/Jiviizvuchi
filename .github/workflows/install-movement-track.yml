name: Install movement track
on:
  push:
    branches: [main]
    paths:
      - movement-track.js
      - .github/workflows/install-movement-track.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add movement track module to diary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('diary.html')
          text = p.read_text()
          tag = '<script type="module" src="/movement-track.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text)
          PY
      - name: Commit installed module
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary.html
          git commit -m "Enable Maria movement track in diary"
          git push
